[package]
name = "uxsp-core"
version = "1.2.0"
edition = "2021"
authors = ["SIVA RAJA S"]
description = "High-performance hybrid classical + post-quantum cryptographic engine for UXSP"

[lib]
name = "uxsp_core"
crate-type = ["cdylib", "rlib", "staticlib"]

[features]
default = ["python", "wasm"]
python = ["dep:pyo3"]
wasm = ["dep:wasm-bindgen"]

[dependencies]
aes-gcm = "0.10"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
hkdf = "0.12"
sha2 = "0.10"
rand = "0.8"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Optional features for Python & WASM bindings
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py38"], optional = true }
wasm-bindgen = { version = "0.2", optional = true }

[dev-dependencies]
serde_json = "1.0"
