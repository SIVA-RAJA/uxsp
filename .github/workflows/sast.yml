name: Static Application Security Testing (SAST)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run every Monday at 02:00 UTC to catch newly disclosed vulnerabilities
    - cron: '0 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  # ── CodeQL Semantic Code Analysis ──────────────────────────────────────────
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            build-mode: none
          - language: javascript-typescript
            build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"

  # ── Bandit Python AST Security Analysis ─────────────────────────────────────
  bandit:
    name: Bandit SAST (Python)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Bandit & SARIF Formatter
        run: |
          python -m pip install --upgrade pip
          pip install "bandit[sarif]>=1.7.8"

      - name: Run Bandit SAST (Console Output)
        run: |
          bandit -c pyproject.toml -r uxsp/

      - name: Generate Bandit SARIF Report
        if: always()
        run: |
          bandit -c pyproject.toml -r uxsp/ -f sarif -o bandit-results.sarif || true

      - name: Upload Bandit SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: bandit-results.sarif
          category: bandit
        continue-on-error: true

  # ── Ruff Security Rules (flake8-bandit / S rules) ───────────────────────────
  ruff-security:
    name: Ruff Security Rules (S)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Ruff
        run: pip install "ruff>=0.15.12"

      - name: Run Ruff Security Analysis
        run: ruff check --select S uxsp

  # ── Semgrep SAST Analysis ──────────────────────────────────────────────────
  semgrep:
    name: Semgrep SAST (Polyglot)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Semgrep Security Rulesets
        run: |
          semgrep scan \
            --config "p/security-audit" \
            --config "p/owasp-top-ten" \
            --config "p/python" \
            --config "p/typescript" \
            --sarif \
            --output semgrep-results.sarif \
            --exclude "tests" \
            --exclude "sdks/js/tests" \
            --exclude "docs" \
            --exclude ".venv" \
            uxsp/ sdks/js/src/ || true

      - name: Upload Semgrep SARIF Report
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: semgrep-results.sarif
          category: semgrep
        continue-on-error: true

  # ── Secret Detection (Gitleaks) ─────────────────────────────────────────────
  gitleaks:
    name: Gitleaks Secret Detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  # ── Dependency Vulnerability Audit (SCA) ────────────────────────────────────
  dependency-audit:
    name: Dependency Vulnerability Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Audit Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "pip-audit>=2.7.0"
          pip install -e ".[all]"
          pip-audit --desc

      - name: Audit JavaScript/TypeScript SDK Dependencies
        working-directory: sdks/js
        run: |
          npm audit --audit-level=high
