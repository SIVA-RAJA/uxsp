name: Publish & CI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  lint:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev,postgres,redis]"

      - name: Run Ruff Linter
        run: |
          ruff check uxsp

      - name: Run Mypy Type Checker
        run: |
          mypy uxsp

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ '3.11', '3.12' ]

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Cache liboqs C library
        id: cache-liboqs
        uses: actions/cache@v4
        with:
          path: ~/liboqs-install
          key: ${{ runner.os }}-liboqs-main-v1
          restore-keys: |
            ${{ runner.os }}-liboqs-main-

      - name: Compile and Install liboqs (if cache miss)
        if: steps.cache-liboqs.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build git libssl-dev
          git clone --depth=1 https://github.com/open-quantum-safe/liboqs.git
          cd liboqs
          mkdir build && cd build
          cmake -GNinja -DOQS_USE_OPENSSL=ON -DBUILD_SHARED_LIBS=ON -DCMAKE_INSTALL_PREFIX=$HOME/liboqs-install ..
          ninja
          ninja install

      - name: Discover and Export liboqs paths
        run: |
          SO_PATH=$(find $HOME/liboqs-install -name "liboqs.so" | head -n 1)
          if [ -z "$SO_PATH" ]; then
            echo "Error: liboqs.so not found in $HOME/liboqs-install"
            exit 1
          fi
          echo "Successfully discovered liboqs.so at: $SO_PATH"
          echo "LIBOQS_INSTALL_PATH=$SO_PATH" >> $GITHUB_ENV
          echo "LD_LIBRARY_PATH=$(dirname $SO_PATH):$LD_LIBRARY_PATH" >> $GITHUB_ENV

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev,postgres,redis]"

      - name: Run Test Suite (pytest)
        run: |
          pytest

  publish:
    name: Build & Publish to PyPI
    needs: [ lint, test ]
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install packaging tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Build Source and Wheel distributions
        run: |
          python -m build

      - name: Archive build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: uxsp-dist-${{ github.sha }}
          path: dist/
          retention-days: 7

      - name: Publish Package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-npm:
    name: Build & Publish JS/TS SDK to npm
    needs: [ lint, test ]
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build JS SDK
        working-directory: sdks/js
        run: |
          npm ci
          npm run build

      - name: Run JS SDK Tests
        working-directory: sdks/js
        run: |
          npm test

      - name: Publish to npm
        working-directory: sdks/js
        run: npm publish --provenance --access public

  publish-dotnet:
    name: Build & Publish .NET SDK to NuGet
    needs: [ lint, test ]
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore sdks/dotnet/UXSP.Client/UXSPClient.csproj

      - name: Build .NET SDK
        run: dotnet build --configuration Release --no-restore sdks/dotnet/UXSP.Client/UXSPClient.csproj

      - name: Test .NET SDK
        run: dotnet test sdks/dotnet/UXSP.Client.Tests/UXSP.Client.Tests.csproj

      - name: Pack NuGet Package
        run: dotnet pack --configuration Release --no-build -o out sdks/dotnet/UXSP.Client/UXSPClient.csproj

      - name: Push to NuGet.org
        run: dotnet nuget push out/*.nupkg --source https://api.nuget.org/v3/index.json --skip-duplicate

  publish-maven:
    name: Build & Publish Java SDK to Maven Central
    needs: [ lint, test ]
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.MAVEN_GPG_PASSPHRASE }}

      - name: Build & Deploy Java SDK
        working-directory: sdks/java
        run: mvn --batch-mode clean deploy -DskipTests
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}

  release-go:
    name: Validate & Index Go SDK
    needs: [ lint, test ]
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Test Go SDK
        working-directory: sdks/go
        run: go test -v ./...

      - name: Re-index on Go Proxy
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          echo "Notifying Go Proxy for module tag: ${TAG_NAME}"
          curl -s "https://proxy.golang.org/github.com/SIVA-RAJA/uxsp/sdks/go/@v/${TAG_NAME}.info" || true

  release-swift:
    name: Validate & Publish Swift SDK
    needs: [ lint, test ]
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      github.event_name == 'workflow_dispatch'
    runs-on: macos-14
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Build Swift Package
        working-directory: sdks/swift
        run: swift build -c release

      - name: Run Swift Package Tests
        working-directory: sdks/swift
        run: swift test

