name: Dynamic Application Security Testing (DAST)

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  # ── 1. Protocol & Middleware DAST Suite ─────────────────────────────────────
  dast-protocol:
    name: Protocol & Replay DAST Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Cache liboqs C library
        id: cache-liboqs
        uses: actions/cache@v4
        with:
          path: ~/liboqs-install
          key: ${{ runner.os }}-liboqs-main-v1
          restore-keys: |
            ${{ runner.os }}-liboqs-main-

      - name: Compile and Install liboqs (if cache miss)
        if: steps.cache-liboqs.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build git libssl-dev
          git clone --depth=1 https://github.com/open-quantum-safe/liboqs.git
          cd liboqs
          mkdir build && cd build
          cmake -GNinja -DOQS_USE_OPENSSL=ON -DBUILD_SHARED_LIBS=ON -DCMAKE_INSTALL_PREFIX=$HOME/liboqs-install ..
          ninja
          ninja install

      - name: Discover and Export liboqs paths
        run: |
          SO_PATH=$(find $HOME/liboqs-install -name "liboqs.so" | head -n 1)
          if [ -z "$SO_PATH" ]; then
            echo "Error: liboqs.so not found in $HOME/liboqs-install"
            exit 1
          fi
          echo "Successfully discovered liboqs.so at: $SO_PATH"
          echo "LIBOQS_INSTALL_PATH=$SO_PATH" >> $GITHUB_ENV
          echo "LD_LIBRARY_PATH=$(dirname $SO_PATH):$LD_LIBRARY_PATH" >> $GITHUB_ENV

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip "setuptools>=84.1.0"
          pip install -e ".[all,dev,dast]"

      - name: Run Python DAST Test Suite
        run: |
          pytest tests/test_dast_security.py -v

  # ── 2. Schemathesis OpenAPI Dynamic Fuzzing ─────────────────────────────────
  schemathesis-fuzz:
    name: Schemathesis Property-Based OpenAPI Fuzzing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Cache liboqs C library
        id: cache-liboqs
        uses: actions/cache@v4
        with:
          path: ~/liboqs-install
          key: ${{ runner.os }}-liboqs-main-v1
          restore-keys: |
            ${{ runner.os }}-liboqs-main-

      - name: Compile and Install liboqs (if cache miss)
        if: steps.cache-liboqs.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build git libssl-dev
          git clone --depth=1 https://github.com/open-quantum-safe/liboqs.git
          cd liboqs
          mkdir build && cd build
          cmake -GNinja -DOQS_USE_OPENSSL=ON -DBUILD_SHARED_LIBS=ON -DCMAKE_INSTALL_PREFIX=$HOME/liboqs-install ..
          ninja
          ninja install

      - name: Discover and Export liboqs paths
        run: |
          SO_PATH=$(find $HOME/liboqs-install -name "liboqs.so" | head -n 1)
          echo "LIBOQS_INSTALL_PATH=$SO_PATH" >> $GITHUB_ENV
          echo "LD_LIBRARY_PATH=$(dirname $SO_PATH):$LD_LIBRARY_PATH" >> $GITHUB_ENV

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip "setuptools>=84.1.0"
          pip install -e ".[all,dev,dast]"

      - name: Start Reference UXSP Server
        run: |
          python scripts/dast_server.py --port 8899 &
          sleep 3
          curl -f http://127.0.0.1:8899/api/public/health

      - name: Run Schemathesis Dynamic Fuzzer
        run: |
          mkdir -p dast-reports
          schemathesis run http://127.0.0.1:8899/openapi.json \
            --checks not_a_server_error \
            --max-examples 25 \
            --no-color \
            --report-junit-path dast-reports/schemathesis-junit.xml

      - name: Upload Fuzzing Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: schemathesis-dast-report
          path: dast-reports/

  # ── 3. OWASP ZAP API Dynamic Security Scanner ───────────────────────────────
  owasp-zap:
    name: OWASP ZAP API Dynamic Scanner
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Cache liboqs C library
        id: cache-liboqs
        uses: actions/cache@v4
        with:
          path: ~/liboqs-install
          key: ${{ runner.os }}-liboqs-main-v1
          restore-keys: |
            ${{ runner.os }}-liboqs-main-

      - name: Compile and Install liboqs (if cache miss)
        if: steps.cache-liboqs.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build git libssl-dev
          git clone --depth=1 https://github.com/open-quantum-safe/liboqs.git
          cd liboqs
          mkdir build && cd build
          cmake -GNinja -DOQS_USE_OPENSSL=ON -DBUILD_SHARED_LIBS=ON -DCMAKE_INSTALL_PREFIX=$HOME/liboqs-install ..
          ninja
          ninja install

      - name: Discover and Export liboqs paths
        run: |
          SO_PATH=$(find $HOME/liboqs-install -name "liboqs.so" | head -n 1)
          echo "LIBOQS_INSTALL_PATH=$SO_PATH" >> $GITHUB_ENV
          echo "LD_LIBRARY_PATH=$(dirname $SO_PATH):$LD_LIBRARY_PATH" >> $GITHUB_ENV

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip "setuptools>=84.1.0"
          pip install -e ".[all,dev,dast]"

      - name: Start Reference UXSP Server
        run: |
          python scripts/dast_server.py --port 8899 &
          sleep 3
          curl -f http://127.0.0.1:8899/api/public/health

      - name: Run OWASP ZAP API Scan
        uses: zaproxy/action-api-scan@v0.9.0
        with:
          target: 'http://127.0.0.1:8899/openapi.json'
          format: openapi
          fail_action: false
          allow_issue_writing: false

      - name: Upload OWASP ZAP Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-scan-report
          path: |
            report_html.html
            report_json.json
            report_md.md
